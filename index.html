<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart To-Do List</title>
  
  <!-- CSS Style link -->
  <link rel="stylesheet" href="style.css">
  
  <!-- PWA Manifest link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4A90E2">
  
  <!-- Apple iOS Support -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/906/906334.png">
</head>
<body>

  <div class="app-container">
    <header>
      <img src="https://cdn-icons-png.flaticon.com/512/906/906334.png" alt="App Logo" class="app-logo">
      <h1>Smart To-Do</h1>
      <button id="install-btn" class="install-btn" style="display: none;">📱 Install App</button>
    </header>

    <div class="input-container">
      <input type="text" id="todo-input" placeholder="Naya task likhein...">
      <button id="add-btn">Add Task</button>
    </div>

    <ul id="todo-list" class="todo-list"></ul>
  </div>

  <!-- JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
