<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Manager</title>
    
    <!-- PWA & Theme Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo">
                <i class="fa-solid fa-check-double"></i>
                <h1>SmartDo</h1>
            </div>
            <button id="install-btn" class="install-btn hidden">
                <i class="fa-solid fa-download"></i> Install App
            </button>
        </header>

        <!-- Stats Card -->
        <div class="stats-card">
            <div class="stats-info">
                <h2>Progress Overview</h2>
                <p id="progress-text">0 of 0 tasks completed</p>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <!-- Input Section -->
        <form id="task-form" class="task-input-container">
            <input type="text" id="task-input" placeholder="Add a new task..." required autocomplete="off">
            <select id="priority-select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>
            <button type="submit" id="add-btn">
                <i class="fa-solid fa-plus"></i> Add
            </button>
        </form>

        <!-- Filters -->
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Task List -->
        <ul id="task-list" class="task-list"></ul>
    </div>

    <!-- JavaScript Link -->
    <script src="script.js"></script>
</body>
</html>
